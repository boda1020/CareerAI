name: career_ai
description: AI-Powered Career Development & Job Readiness Platform.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0+1
  connectivity_plus: ^6.0.3

  # Firebase
  firebase_core: ^3.2.0
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.1.0
  firebase_storage: ^12.1.0
  firebase_messaging: ^15.0.3

  # Storage & Utilities
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  uuid: ^4.4.0
  path_provider: ^2.1.3
  file_picker: ^8.0.7
  
  # UI & Icons
  google_fonts: ^6.2.1
  lucide_icons: ^0.301.0
  flutter_spinkit: ^5.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3

  # Data Modeling
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Code Generation
  build_runner: ^2.4.11
  freezed: ^2.5.5
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.2

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
  #   - assets/icons/
